# CD 2: 버튼을 눌렀을 때만 EC2에 배포한다. (Actions 탭 -> Deploy -> Run workflow)
# 순서: EC2 켜져 있나 확인 -> SSH 문을 내 러너 IP에만 잠깐 열기 -> 배포 -> 헬스체크 -> 문 닫기
# 전제: 배포 전에 AWS 콘솔에서 EC2를 먼저 켠다. (이 워크플로는 EC2를 켜거나 끄지 않는다)
# 이미지는 CI가 main push 때 Docker Hub에 올린 latest를 쓴다.
name: Deploy

on:
  workflow_dispatch:   # 수동 실행만. push 등으로는 절대 자동 실행되지 않는다.

# 배포 두 개가 동시에 돌면 서로 꼬이니 하나씩만. 도는 배포는 취소하지 않고 끝까지 둔다(중간에 끊기면 반쪽 배포).
concurrency:
  group: deploy
  cancel-in-progress: false

# 코드를 읽을 일이 없어서 최소 권한. (AWS 권한은 Secrets의 IAM 키로 따로 받는다)
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # 멈춰도 15분 만에 끊는다
    env:
      # 비밀이 아닌 값은 Variables, 비밀은 Secrets. ${{ }} 값은 스크립트에 직접 끼우지 않고 env로만 쓴다.
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      EC2_SECURITY_GROUP_ID: ${{ vars.EC2_SECURITY_GROUP_ID }}
    steps:
      # AWS 로그인. 액세스 키는 저장소 Secrets에서만 읽는다.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true   # 저장소가 public이라 로그에 계정 ID가 보이지 않게 가린다

      # EC2가 켜져(running) 있고 퍼블릭 IP가 있어야 진행한다. (IP는 켤 때마다 바뀌므로 매번 조회)
      # 여기서 실패하면 보안 그룹은 아직 건드리기 전이라 정리할 것이 없다.
      - name: EC2 상태·IP 확인
        run: |
          set -euo pipefail
          # 한 번만 조회해서 상태와 IP를 함께 받는다. (출력: "상태<탭>IP")
          # 조회 자체가 실패하면(ID 오타, 권한 없음 등) set -e로 여기서 바로 멈춘다. 원인은 위의 aws 에러 줄에 나온다.
          RESULT=$(aws ec2 describe-instances --instance-ids "$EC2_INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].[State.Name,PublicIpAddress]' --output text)
          read -r STATE IP <<< "$RESULT"
          if [ "$STATE" != "running" ]; then
            echo "::error::EC2가 실행 중이 아님(상태: $STATE). 콘솔에서 켜고 다시 실행"
            exit 1
          fi
          if [ -z "${IP:-}" ] || [ "$IP" = "None" ]; then
            echo "::error::EC2는 running인데 퍼블릭 IP가 없음. 퍼블릭 IP 할당 설정을 확인"
            exit 1
          fi
          # public 저장소라 로그에 IP가 보이지 않게 먼저 가린 뒤 저장한다.
          echo "::add-mask::$IP"
          echo "EC2_IP=$IP" >> "$GITHUB_ENV"

      # SSH(22번) 문을 이 러너의 IP 하나(/32)에만 연다. 설명을 붙여 두면 콘솔에서 알아보기 쉽다.
      # 규칙을 추가하기 "전에" runner_ip를 남겨 둔다. authorize 도중 끊겨도 마지막 정리 단계가 닫을 수 있다.
      - name: 보안 그룹에 러너 IP의 SSH 허용 추가
        id: open_sg
        run: |
          set -euo pipefail
          RUNNER_IP=$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')
          # IPv4 형식이 아니면 규칙에 넣지 않고 실패한다.
          if ! [[ "$RUNNER_IP" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "::error::러너 IP를 IPv4 형식으로 얻지 못함"
            exit 1
          fi
          echo "::add-mask::$RUNNER_IP"
          echo "runner_ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"
          # 응답 JSON은 출력하지 않는다. 실패했을 때만 오류 메시지로 원인을 판별한다.
          if ! OUT=$(aws ec2 authorize-security-group-ingress \
            --group-id "$EC2_SECURITY_GROUP_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${RUNNER_IP}/32,Description=github-actions-deploy}]" \
            --query 'Return' --output text 2>&1); then
            if [[ "$OUT" == *InvalidPermission.Duplicate* ]]; then
              echo "이미 열려 있는 규칙이라 그대로 진행"
            else
              echo "$OUT"
              exit 1
            fi
          fi

      # 배포 전용 SSH 키를 파일로 만든다(권한 600). 비밀이라 Secrets에서만 읽는다.
      - name: SSH 키 준비
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          umask 077
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      # 새로 켠 EC2는 SSH가 뜨기까지 시간이 걸리고 보안 그룹 반영도 잠깐 늦을 수 있어 재시도한다.
      # EC2를 껐다 켜도 host key는 그대로지만, 편의상 접속 직전에 ssh-keyscan으로 받는다(TOFU).
      # IP는 AWS API로 조회한 값이라 위험은 낮다.
      - name: EC2 SSH 접속 대기·host key 받기
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if ssh-keyscan -T 5 -H "$EC2_IP" > ~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ]; then
              echo "SSH 준비됨 (시도 $i)"
              exit 0
            fi
            echo "SSH 아직 안 열림, 10초 뒤 재시도 ($i/12)"
            sleep 10
          done
          echo "::error::SSH 접속 준비가 안 됨"
          exit 1

      # 새 이미지를 받아 컨테이너를 다시 띄운다. 끝나면 안 쓰는 옛 이미지를 지워 작은 디스크를 아낀다.
      - name: EC2에서 배포
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 "ec2-user@$EC2_IP" \
            'set -e; cd ~/board && docker compose --profile prod pull && docker compose --profile prod up -d && docker image prune -f'

      # 앱(Spring)이 뜨는 데 시간이 걸려서 최대 약 3~4분(10초 간격 18번, 응답 대기 포함) 기다리며 확인한다.
      # HTTP 200이고 본문에 "status":"UP"이 있어야 성공이다.
      - name: 헬스체크
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            CODE=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 5 "http://$EC2_IP/actuator/health" || true)
            if [ "$CODE" = "200" ] && grep -q '"status":"UP"' /tmp/health.json; then
              echo "헬스체크 통과 (시도 $i)"
              exit 0
            fi
            echo "아직 준비 안 됨 (HTTP $CODE), 10초 뒤 재시도 ($i/18)"
            sleep 10
          done
          echo "::error::약 3~4분 안에 헬스체크가 UP이 되지 않음"
          exit 1

      # 성공이든 실패든 항상 실행해서 SSH 문을 닫는다. 러너 IP를 기록한 경우(runner_ip가 있을 때)만 실행한다.
      # 그래서 EC2가 꺼져 있어서 일찍 실패한 경우에는 이 단계가 건너뛰어진다.
      # 규칙이 이미 없으면(NotFound) 무시하고, 그 외 오류는 실패로 처리한다.
      - name: 보안 그룹에서 러너 IP 규칙 제거
        if: always() && steps.open_sg.outputs.runner_ip != ''
        env:
          RUNNER_IP: ${{ steps.open_sg.outputs.runner_ip }}
        run: |
          set -uo pipefail
          # 응답 JSON은 출력하지 않는다.
          if ! OUT=$(aws ec2 revoke-security-group-ingress \
            --group-id "$EC2_SECURITY_GROUP_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${RUNNER_IP}/32}]" \
            --query 'Return' --output text 2>&1); then
            if [[ "$OUT" == *InvalidPermission.NotFound* ]]; then
              echo "지울 규칙이 이미 없음, 넘어감"
              exit 0
            fi
            echo "$OUT"
            exit 1
          fi
