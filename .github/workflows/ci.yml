# CI: 코드를 올릴 때마다 자동으로 테스트·빌드를 돌려서 망가졌는지 알려준다.
# CD 1: main에 push되고 테스트(백엔드·프론트·e2e)가 모두 통과하면 Docker 이미지를 빌드해 Docker Hub에 올린다. (EC2 배포는 아직 안 함)
name: CI

on:
  push:            # 모든 브랜치에 push할 때 (태그 push는 제외)
    branches: ['**']
  pull_request:    # main으로 가는 PR일 때
    branches: [main]

# 같은 브랜치에 새로 push하면 아직 돌고 있는 이전 실행은 취소한다(시간 낭비 방지).
# 단, main은 도는 실행을 취소하지 않는다: 이미지 push 도중 끊기면 backend 이미지만 새것인 반쪽 상태가 될 수 있다.
# (main은 도는 실행을 끝까지 두고, 기다리는 실행은 가장 최신 1개만 남긴다. 중간 커밋은 건너뛸 수 있다)
# 참고: 취소가 아니어도 backend push 뒤 frontend가 실패하면 한쪽만 갱신될 수 있다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# 코드를 읽기만 하면 되니까 권한을 최소로 둔다. (Docker Hub 로그인은 Secrets로 따로 한다)
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # 멈춰도 기본 6시간 대신 15분 만에 끊는다
    steps:
      # 저장소 코드를 러너로 내려받는다.
      - uses: actions/checkout@v7

      # Java 21 설치 + Gradle 캐시(다음 실행이 빨라진다).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # 테스트 DB는 Testcontainers가 러너의 Docker로 직접 띄우므로 서비스 컨테이너는 필요 없다.
      - name: 백엔드 테스트
        run: ./gradlew test

      # 테스트가 실패했을 때만 리포트를 올려서 원인을 볼 수 있게 한다.
      - name: 실패 시 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # 멈춰도 10분 만에 끊는다
    defaults:
      run:
        working-directory: frontend   # 프론트 명령은 frontend 폴더에서 실행
    steps:
      - uses: actions/checkout@v7

      # Node 24 (frontend/Dockerfile과 같은 버전) + npm 캐시.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # package-lock.json 그대로 정확히 설치한다.
      - name: 의존성 설치
        run: npm ci

      # 코드 스타일·문제를 검사한다.
      - name: 린트
        run: npm run lint

      # 순수 함수 단위 테스트(Vitest)를 돌린다.
      - name: 단위 테스트
        run: npm test

      # 타입 검사 + 프로덕션 빌드가 되는지 확인한다.
      - name: 빌드
        run: npm run build

  # 브라우저 e2e 테스트(Playwright): 진짜 Chromium으로 화면을 눌러 보며 핵심 흐름을 확인한다.
  # 백엔드는 필요 없다(API 응답을 가짜로 대체). Vite 서버는 playwright.config.ts의 webServer가 직접 띄운다.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # 멈춰도 15분 만에 끊는다
    defaults:
      run:
        working-directory: frontend   # 프론트 명령은 frontend 폴더에서 실행
    steps:
      - uses: actions/checkout@v7

      # Node 24 + npm 캐시 (frontend 작업과 동일).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # package-lock.json 그대로 정확히 설치한다.
      - name: 의존성 설치
        run: npm ci

      # 테스트용 Chromium 브라우저와 리눅스 필수 라이브러리를 설치한다. (CI=true라 config가 기본 Chromium을 쓴다)
      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium

      # e2e 테스트 실행. CI에서는 실패 시 2번 재시도, html 리포트를 만든다.
      - name: e2e 테스트
        run: npm run test:e2e

      # 실패했을 때만 리포트를 올려 원인을 볼 수 있게 한다.
      # upload-artifact의 path는 working-directory 영향을 안 받으므로 저장소 루트 기준으로 쓴다.
      - name: 실패 시 e2e 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore

  # backend, frontend, e2e가 모두 성공하고, main 브랜치 push일 때만 실행된다.
  # (다른 브랜치 push, PR에서는 건너뜀. e2e가 실패하면 이미지 push도 막힌다)
  images:
    needs: [backend, frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20   # 멈춰도 20분 만에 끊는다
    steps:
      - uses: actions/checkout@v7

      # Docker Hub 로그인. 아이디·토큰은 저장소 Secrets에서만 읽는다.
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 이미지 빌드 도구(buildx). 빌드 캐시를 쓰려면 필요하다.
      # 러너(ubuntu-latest)와 EC2(t3.micro)가 둘 다 amd64라서 --platform 지정이나 QEMU는 필요 없다.
      - uses: docker/setup-buildx-action@v4

      # 백엔드 이미지: 저장소 루트의 Dockerfile, 빌드 컨텍스트는 루트(.)
      # 계정명(seokam36)은 비밀이 아니고 docker-compose.yml에도 적혀 있어 그대로 고정한다.
      - name: 백엔드 이미지 빌드·push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            seokam36/demo:latest
            seokam36/demo:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      # 프론트 이미지: frontend/Dockerfile, 빌드 컨텍스트는 frontend/
      # 빌드 인자 VITE_API_BASE_URL은 Dockerfile 기본값(/api)을 그대로 쓴다.
      - name: 프론트 이미지 빌드·push
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: true
          tags: |
            seokam36/demo-web:latest
            seokam36/demo-web:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
