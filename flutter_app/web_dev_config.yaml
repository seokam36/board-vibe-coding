# 개발 서버(flutter run -d chrome / web-server) 설정.
# React의 vite 프록시와 같은 역할: 브라우저는 5175 한 곳(같은 출처)만 부르고,
# /api/ 로 시작하는 요청은 개발 서버가 백엔드(8080)로 대신 전달한다.
# 같은 출처라서 쿠키(access_token·refresh_token·XSRF-TOKEN)는 브라우저가 알아서 주고받는다.
# 주의: 이 프록시는 백엔드로 넘길 때 Host를 localhost:8080으로 바꾼다(끄는 설정 없음).
#   브라우저는 POST·PUT·DELETE에 Origin: http://localhost:5175를 붙이므로 백엔드는 이것을 CORS 요청으로 본다.
#   → 로컬 .env에 CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:5175 가 있어야 쓰기 요청이 된다
#     (없으면 403 "Invalid CORS request", 2026-11-14 재현). 백엔드 코드·설정 파일은 바꾸지 않는다.
server:
  port: 5175
  proxy:
    - target: "http://localhost:8080/"
      prefix: "/api/"   # /api/csrf -> http://localhost:8080/csrf
      replace: ""
