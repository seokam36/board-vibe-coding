server {
    listen 80;

    # 도커 내부 주소록(DNS). 10초마다 app 주소를 다시 확인한다
    resolver 127.0.0.11 valid=10s ipv6=off;
    # 주소를 변수에 담으면 nginx가 시작할 때 IP를 고정하지 않고 요청 때마다 resolver로 찾는다
    # (app 컨테이너가 다시 만들어져 IP가 바뀌어도 따라간다. app이 아직 없어도 nginx는 시작되고, 요청 때만 502가 난다)
    set $backend http://app:8080;

    root /usr/share/nginx/html;
    index index.html;

    # 압축: wasm·js 같은 큰 파일을 전송 중에 줄여 로딩을 빠르게 한다 (text/html은 기본 포함)
    # 미리 압축해 두는 gzip_static은 쓰지 않는다(요청 때마다 압축하는 방식으로 충분)
    # server 전체에 걸리므로 /api/ 프록시의 1KB 넘는 JSON 응답도 압축된다(React 설정과 다른 점, 의도함.
    # 프록시 블록 글자는 React와 같지만 동작은 이 한 가지가 다르다. SSE(text/event-stream)는 목록에 없어 안전)
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript application/wasm application/json text/css image/svg+xml text/plain;

    # 프록시 공통 헤더: 백엔드가 실제 접속자 정보를 알 수 있게 전달한다
    # (location 안에 add_header/proxy_set_header를 하나라도 쓰면 상위 설정이 상속되지 않으므로,
    #  프록시 location마다 같은 헤더를 직접 적는다)

    # API: /api/posts -> app:8080/posts
    # 변수를 쓰면 proxy_pass 끝의 "/" 로 접두사를 뗄 수 없어서 rewrite로 /api 를 뗀다
    # (rewrite는 쿼리스트링을 자동으로 유지한다. break: 다시 location 검색 없이 바로 프록시)
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 사진 올리기 주소만(S13-g6): POST /api/market-items/{id}/photos
    # 다른 API(글·댓글 JSON 등)는 기본값(본문 1m, 응답 대기 60s)을 그대로 두려고 이 주소만 따로 뺀다.
    # (정규식 location은 위 /api/ 접두사 location보다 먼저 고른다. /api/actuator는 ^~라 영향 없음)
    location ~ ^/api/market-items/[0-9]+/photos$ {
        # nginx 기본 한도 1m라 3MB 사진도 413. 스프링 max-request-size(11MB)와 맞춤
        client_max_body_size 11m;
        # 처리 자리 대기(최대 5초) + 이미지 처리 + S3 put 2번(각 최대 60초)이 끝나기 전에
        # nginx가 먼저 504를 내면 "저장은 됐는데 화면은 실패"가 된다 -> 넉넉히 150초 (기본 60초)
        proxy_read_timeout 150s;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /api/ 프록시를 통해 actuator로 우회하는 것을 막는다 (끝 슬래시 없이 써서 /api/actuator 도 막는다)
    # (nginx 차단은 보조. 실제 차단은 백엔드 application.properties의 exposure 설정(health만))
    location ^~ /api/actuator {
        return 404;
    }

    # 헬스체크: 정확히 이 경로만 연다 (=). 경로를 그대로 전달한다.
    # actuator의 다른 경로(env 등)는 nginx에서 열지 않는다
    location = /actuator/health {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- 화면 파일 (Flutter 웹) ----------
    # 규칙(공식 문서 기준): 해시가 없는 파일은 매번 확인(no-cache), 이름에 해시가 붙은 파일만 오래 캐시.
    # 해시가 붙은 파일은 내용이 바뀌면 이름도 바뀌므로 오래 캐시해도 안전하다.
    # (location 안에 add_header를 쓰면 상위 설정을 상속하지 않으므로 location마다 직접 적는다)

    # 그 밖의 모든 주소: index.html, flutter_bootstrap.js, flutter.js, manifest.json, version.json 등 해시 없는 루트 파일.
    # 없는 경로(/posts/7 새로고침 등)는 index.html로 보내 앱 안의 라우터(go_router)가 처리하게 한다
    location / {
        try_files $uri $uri/ /index.html;
        # 새 배포가 바로 반영되도록 항상 최신본인지 확인하게 한다
        add_header Cache-Control "no-cache";
    }

    # 해시 붙은 앱 본체: main.dart.<8자리 해시>.js
    # 정규식 앞을 ^/main\.dart 로 고정해 /api 같은 다른 주소를 가로채지 않게 한다.
    # 정규식 location은 아래 접두사 location(/main.dart.)보다 먼저 고른다. 없는 파일은 404.
    # (정규식에 { } 가 있으면 nginx가 설정 문법으로 착각하므로 따옴표로 감싼다)
    location ~ "^/main\.dart\.[0-9a-f]{8}\.js$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # main.dart.* 중 해시 없는 것(main.dart.js 등)이나 없는 파일: index.html로 폴백하지 않고 404
    location /main.dart. {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # assets/ 안에서 이름에 8자리 해시가 붙은 파일 (AssetManifest.<해시>.bin, NOTICES.<해시> 등)
    # 정규식이 접두사 location(/assets/)보다 먼저 선택된다. 없는 파일은 404.
    location ~ "^/assets/.+\.[0-9a-f]{8}(\.[^/.]+)?$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # assets/ 안의 해시 없는 파일(있다면): 항상 확인. 없는 파일은 index.html 대신 404
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # canvaskit(그림 그리는 엔진), icons: 이름에 해시가 없어 내용이 바뀌어도 이름이 같다 -> no-cache.
    # ^~ : 이 접두사가 맞으면 정규식 location 검사를 건너뛴다. 없는 파일은 404
    location ^~ /canvaskit/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location ^~ /icons/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
}
