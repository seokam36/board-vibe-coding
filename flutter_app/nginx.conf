# S22: 문이 두 개다.
#  - 80(http): 인증서 발급·갱신 확인 길, 헬스체크만 직접 처리하고 나머지는 전부 https로 보낸다(301)
#  - 443(https): 실제 사이트. 화면·/api 규칙은 공용 파일(board-locations.conf) 하나를 불러 쓴다
# 주의: 443 블록은 인증서 파일이 있어야 nginx가 시작된다. 인증서가 없는 서버에서 이 이미지를 띄우면
#       nginx가 시작 실패한다(사이트 전체 다운) -> 운영 전환 순서는 docs/deploy.md "S22 HTTPS 전환".
# HSTS(Strict-Transport-Security)는 일부러 넣지 않는다: 넣으면 브라우저가 https만 기억해서 되돌리기가 어렵다.

server {
    listen 80;

    # 헬스체크용 프록시에만 쓰는 주소 (설명은 board-locations.conf 맨 위)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://app:8080;

    # Let's Encrypt가 "이 도메인 주인 맞나" 확인하러 오는 길 (http-01 방식, 반드시 80번이어야 함)
    # certbot이 이 폴더에 확인용 파일을 잠깐 쓰고, Let's Encrypt가 그 파일을 읽어 간다
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # 헬스체크는 리다이렉트 없이 그대로 답한다: Deploy 워크플로가 http://<IP>/actuator/health 로 확인하기 때문
    # (IP로 https에 붙으면 인증서 이름이 안 맞아 실패하므로 80에 남겨 둔다)
    location = /actuator/health {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 그 밖의 모든 주소: 같은 주소의 https로 영구 이동(301). 주소 뒤 경로·쿼리도 그대로 붙인다
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    # http2: 파일 여러 개(Flutter 웹)를 연결 하나로 동시에 받아 첫 화면이 빨라진다
    http2 on;

    # 인증서 위치. certbot을 --cert-name board 로 실행하면 도메인 이름과 상관없이 이 경로에 생긴다
    # (그래서 이 공개 저장소에 도메인 이름을 적지 않아도 된다). 서버의 인증서 폴더를 볼륨으로 읽기 전용 연결
    ssl_certificate     /etc/letsencrypt/live/board/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/board/privkey.pem;
    # 오래된 암호 방식(TLS 1.0·1.1)은 끈다
    ssl_protocols TLSv1.2 TLSv1.3;
    # 같은 손님이 다시 올 때 암호 악수를 짧게 (1MB = 약 4천 개 연결 기억, web 메모리 64MB 안에서 충분)
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 1d;

    # 화면·/api·시간·본문 한도 규칙 전부 (Dockerfile이 /etc/nginx/snippets/ 에 복사)
    include /etc/nginx/snippets/board-locations.conf;
}
