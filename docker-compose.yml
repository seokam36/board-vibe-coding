# 로컬: `docker compose up -d` -> postgres + redis만 실행 (앱은 ./gradlew bootRun)
# EC2 : `docker compose --profile prod up -d` -> web(nginx) + app + postgres + redis 실행
services:
  postgres:
    # 17 버전 고정: latest는 갑자기 바뀌어 데이터 호환 문제가 생길 수 있음
    image: postgres:17
    container_name: board-postgres
    # EC2를 껐다 켜도 다시 시작 (없으면 postgres만 Exited로 남아 app이 계속 재시작 반복함)
    restart: unless-stopped
    # 메모리 1GB EC2 대비: 상한을 두고 postgres 내부 메모리/연결 수도 같이 낮춤
    mem_limit: 256m
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=20"]
    environment:
      # .env에서 값을 읽는다 (비밀번호를 파일에 쓰지 않기 위함). 값이 없으면 시작 시 오류
      POSTGRES_DB: ${POSTGRES_DB:?.env에 POSTGRES_DB를 설정하세요}
      POSTGRES_USER: ${POSTGRES_USER:?.env에 POSTGRES_USER를 설정하세요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD를 설정하세요}
    ports:
      # 서버(PC/EC2) 자기 자신(127.0.0.1)에서만 5432 접속 가능. 외부에는 노출되지 않아
      # EC2에서도 유지해도 안전함 (보안 그룹도 5432를 열지 않음). 앱은 compose 내부망으로 접속
      - "127.0.0.1:5432:5432"
    volumes:
      # 컨테이너를 지워도 데이터가 남도록 named volume 사용
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # DB가 접속 가능한 상태인지 확인 (healthy가 되면 사용 가능)
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    # 리프레시 토큰 저장소. 로컬 기본 실행에도 같이 뜬다 (profile 없음)
    image: redis:8.10.3-alpine
    container_name: board-redis
    restart: unless-stopped
    # 메모리 1GB EC2 대비: 컨테이너 64m 상한 + redis 자체 상한 32mb (넘으면 TTL 있는 키부터 지움)
    mem_limit: 64m
    # root가 아닌 redis 사용자로 실행 (침입당했을 때 피해를 줄이기 위함)
    user: redis
    # 비밀번호가 프로세스 인자(ps, docker inspect의 Cmd)에 보이지 않도록 설정을 컨테이너 안 파일(/tmp, 권한 600)에 쓰고,
    # exec로 redis-server가 PID 1이 되게 한다 (docker stop 신호를 바로 받아 빨리 종료).
    # $$는 compose가 $로 바꾸지 않게 한 이스케이프. 디스크 저장 끔(--save "", --appendonly no): 재시작하면 로그인이 풀려도 괜찮다.
    command:
      - sh
      - -c
      - 'umask 077 && printf "requirepass %s\n" "$$REDIS_PASSWORD" > /tmp/redis.conf && exec redis-server /tmp/redis.conf --save "" --appendonly no --maxmemory 32mb --maxmemory-policy volatile-lru'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?.env에 REDIS_PASSWORD를 설정하세요}
      # healthcheck의 redis-cli가 비밀번호를 환경변수로 읽는다 (명령줄 인자에 안 남김)
      REDISCLI_AUTH: ${REDIS_PASSWORD:?.env에 REDIS_PASSWORD를 설정하세요}
    ports:
      # 서버 자기 자신(127.0.0.1)에서만 접속 가능. 외부에는 노출하지 않는다
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    # prod 프로필을 줄 때만 실행됨 (로컬 기본 실행에서는 제외)
    profiles: ["prod"]
    # Docker Hub에서 받은 이미지 사용 (EC2에서는 빌드하지 않음)
    image: seokam36/demo:latest
    container_name: board-app
    restart: unless-stopped
    mem_limit: 512m
    # ports 없음: 외부에서 직접 접근 불가. web(nginx)이 compose 내부망으로 app:8080에 전달한다
    environment:
      # 같은 compose 안에서는 서비스명(postgres)이 호스트 이름이 됨
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?.env에 POSTGRES_DB를 설정하세요}
      DB_USERNAME: ${POSTGRES_USER:?.env에 POSTGRES_USER를 설정하세요}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD를 설정하세요}
      # 로그인 토큰(JWT) 서명 비밀키. .env에서 읽고, 없으면 시작 시 오류
      JWT_SECRET: ${JWT_SECRET:?.env에 JWT_SECRET를 설정하세요}
      # access_token·refresh_token 쿠키 Secure 속성 (HTTPS를 붙이기 전까지는 false)
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # DB 연결 풀 기본값(10)은 작은 서버에 과함 -> 3으로 축소 (설정 파일 없이 환경변수로 처리)
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
      # 리프레시 토큰 저장소(Redis) 접속 정보. 같은 compose 안이라 서비스명(redis)이 호스트
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?.env에 REDIS_PASSWORD를 설정하세요}
      # 학교 메일 인증 코드 발송(S10). 값은 .env에서 읽는다 (비밀번호를 파일에 쓰지 않기 위함).
      # MAIL_MODE: log(기본, 코드를 로그에만 찍음) | smtp(실제 발송). smtp인데 아래 값이 비면 앱이 시작 때 실패한다.
      # 값이 필수는 아니라서(log 모드에서는 안 씀) :? 대신 기본값(:-)을 쓴다
      MAIL_MODE: ${MAIL_MODE:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    depends_on:
      postgres:
        # DB가 healthy가 된 뒤에 앱 시작
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    # prod 프로필을 줄 때만 실행됨
    profiles: ["prod"]
    # 화면 파일 + nginx(리버스 프록시) 이미지. Docker Hub에서 받아 사용
    image: seokam36/demo-web:latest
    container_name: board-web
    restart: unless-stopped
    mem_limit: 64m
    ports:
      # 브라우저 80 -> nginx 80 (유일한 외부 입구. /api 요청은 nginx가 app으로 전달)
      - "80:80"
    # IP 변경은 nginx.conf의 resolver가 처리, 여기서는 시작 순서만
    depends_on:
      - app

volumes:
  postgres-data:
