# 로컬: `docker compose up -d` -> postgres + redis만 실행 (앱은 ./gradlew bootRun)
# EC2 : `docker compose --profile prod up -d` -> web(nginx) + app + postgres + redis 실행
services:
  postgres:
    # 17 버전 고정: latest는 갑자기 바뀌어 데이터 호환 문제가 생길 수 있음
    image: postgres:17
    container_name: board-postgres
    # EC2를 껐다 켜도 다시 시작 (없으면 postgres만 Exited로 남아 app이 계속 재시작 반복함)
    restart: unless-stopped
    # 메모리 1GB EC2 대비: 상한을 두고 postgres 내부 메모리/연결 수도 같이 낮춤
    mem_limit: 256m
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=20"]
    environment:
      # .env에서 값을 읽는다 (비밀번호를 파일에 쓰지 않기 위함). 값이 없으면 시작 시 오류
      POSTGRES_DB: ${POSTGRES_DB:?.env에 POSTGRES_DB를 설정하세요}
      POSTGRES_USER: ${POSTGRES_USER:?.env에 POSTGRES_USER를 설정하세요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD를 설정하세요}
    ports:
      # 서버(PC/EC2) 자기 자신(127.0.0.1)에서만 5432 접속 가능. 외부에는 노출되지 않아
      # EC2에서도 유지해도 안전함 (보안 그룹도 5432를 열지 않음). 앱은 compose 내부망으로 접속
      - "127.0.0.1:5432:5432"
    volumes:
      # 컨테이너를 지워도 데이터가 남도록 named volume 사용
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # DB가 접속 가능한 상태인지 확인 (healthy가 되면 사용 가능)
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    # 리프레시 토큰 저장소. 로컬 기본 실행에도 같이 뜬다 (profile 없음)
    image: redis:8.10.3-alpine
    container_name: board-redis
    restart: unless-stopped
    # 메모리 1GB EC2 대비: 컨테이너 64m 상한 + redis 자체 상한 32mb (넘으면 TTL 있는 키부터 지움)
    mem_limit: 64m
    # root가 아닌 redis 사용자로 실행 (침입당했을 때 피해를 줄이기 위함)
    user: redis
    # 비밀번호가 프로세스 인자(ps, docker inspect의 Cmd)에 보이지 않도록 설정을 컨테이너 안 파일(/tmp, 권한 600)에 쓰고,
    # exec로 redis-server가 PID 1이 되게 한다 (docker stop 신호를 바로 받아 빨리 종료).
    # $$는 compose가 $로 바꾸지 않게 한 이스케이프. 디스크 저장 끔(--save "", --appendonly no): 재시작하면 로그인이 풀려도 괜찮다.
    command:
      - sh
      - -c
      - 'umask 077 && printf "requirepass %s\n" "$$REDIS_PASSWORD" > /tmp/redis.conf && exec redis-server /tmp/redis.conf --save "" --appendonly no --maxmemory 32mb --maxmemory-policy volatile-lru'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?.env에 REDIS_PASSWORD를 설정하세요}
      # healthcheck의 redis-cli가 비밀번호를 환경변수로 읽는다 (명령줄 인자에 안 남김)
      REDISCLI_AUTH: ${REDIS_PASSWORD:?.env에 REDIS_PASSWORD를 설정하세요}
    ports:
      # 서버 자기 자신(127.0.0.1)에서만 접속 가능. 외부에는 노출하지 않는다
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    # prod 프로필을 줄 때만 실행됨 (로컬 기본 실행에서는 제외)
    profiles: ["prod"]
    # Docker Hub에서 받은 이미지 사용 (EC2에서는 빌드하지 않음)
    image: seokam36/demo:latest
    container_name: board-app
    restart: unless-stopped
    mem_limit: 512m
    # ports 없음: 외부에서 직접 접근 불가. web(nginx)이 compose 내부망으로 app:8080에 전달한다
    environment:
      # 같은 compose 안에서는 서비스명(postgres)이 호스트 이름이 됨
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?.env에 POSTGRES_DB를 설정하세요}
      DB_USERNAME: ${POSTGRES_USER:?.env에 POSTGRES_USER를 설정하세요}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD를 설정하세요}
      # 로그인 토큰(JWT) 서명 비밀키. .env에서 읽고, 없으면 시작 시 오류
      JWT_SECRET: ${JWT_SECRET:?.env에 JWT_SECRET를 설정하세요}
      # access_token·refresh_token 쿠키 Secure 속성 (HTTPS를 붙이기 전까지는 false)
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # DB 연결 풀 기본값(10)은 작은 서버에 과함 -> 3으로 축소 (설정 파일 없이 환경변수로 처리)
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
      # https 뒤에서 Spring이 요청을 https로 인식하게 함: nginx가 붙인 X-Forwarded-Proto를 Tomcat이 믿는다
      # (Tomcat RemoteIpValve는 내부망, 즉 도커 172.16/12 등에서 온 것만 믿음).
      # 없으면 브라우저 Origin(https://...)과 scheme(http)이 달라 같은 사이트 POST/PUT/DELETE가
      # CORS 요청으로 판정돼 403("Invalid CORS request")이 난다. http 운영에도 무해(X-Forwarded-Proto=http).
      SERVER_FORWARD_HEADERS_STRATEGY: native
      # 리프레시 토큰 저장소(Redis) 접속 정보. 같은 compose 안이라 서비스명(redis)이 호스트
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?.env에 REDIS_PASSWORD를 설정하세요}
      # 사진 저장소(S13-g6). app은 운영(prod) 전용이라 기본값을 s3로 둔다
      # (local이 되면 컨테이너 안에 사진이 쌓였다가 재배포 때 사라진다. 빈 값이어도 :-가 s3로 채운다)
      PHOTO_STORAGE: ${PHOTO_STORAGE:-s3}
      # 버킷 이름은 .env에서 읽는다. :? 는 prod 아닌 로컬 `docker compose up`의 변수 해석까지 깨뜨릴 수 있어 쓰지 않는다
      # (비어 있으면 앱이 시작할 때 변수 이름을 알려 주며 실패한다)
      PHOTO_S3_BUCKET: ${PHOTO_S3_BUCKET:-}
      # 리전은 비밀이 아님 (서울). 자격 증명은 키 없이 EC2에 붙은 IAM 역할(board-ec2-role)을 쓴다
      PHOTO_S3_REGION: ${PHOTO_S3_REGION:-ap-northeast-2}
      # AI 챗봇 연결(S17·S18). 서버 .env에 LLM_MODE를 안 적으면 off(챗봇 503)라서 예전과 똑같이 동작한다.
      # 켜려면 서버 .env에 LLM_MODE=gemini와 GEMINI_API_KEY를 넣는다. gemini인데 키가 비면 앱이 시작 때 실패한다.
      # 모두 :-(콜론)를 써서 "줄은 있는데 값이 빈" 경우도 기본값으로 채운다
      # (빈 문자열이 그대로 넘어가면 LLM_MODE는 시작 실패, GEMINI_TIMEOUT·상한 숫자는 읽기 실패가 되기 때문)
      LLM_MODE: ${LLM_MODE:-off}
      # 비밀 값: 파일에 쓰지 않고 서버 .env에서만 읽는다. 키 없이 off로 쓸 때를 위해 :? 대신 기본 빈 값
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # 3.x 계열 모델만 쓴다(코드의 thinkingLevel 설정이 3.x 전용). base-url은 일부러 넘기지 않는다(https 고정 기본값 사용)
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      # 질문 하나 전체 시간 예산. 서버 30초 < nginx /api/chat 75초 < 화면 90초 순서를 지킨다(올리면 둘도 같이 올림)
      GEMINI_TIMEOUT: ${GEMINI_TIMEOUT:-30s}
      # 서버 전체 질문 상한(모든 회원 합계). 앱 기본은 0(검사 안 함)이라, 빠뜨려도 무료 한도(분 15·하루 500호출)를 지키도록
      # compose 기본값을 운영 값으로 둔다. 질문 1개 = 호출 최대 2번이라 분 7·하루 200
      CHAT_GLOBAL_PER_MINUTE: ${CHAT_GLOBAL_PER_MINUTE:-7}
      CHAT_GLOBAL_PER_DAY: ${CHAT_GLOBAL_PER_DAY:-200}
      # 유학생 인증(S20). 허가서 번호 해시(HMAC)에 섞는 비밀 값. 서버 .env에서만 읽고 32바이트 이상. 한 번 정하면 바꾸지 않는다.
      # :? 는 prod 아닌 로컬 `docker compose up`의 변수 해석까지 깨뜨릴 수 있어 쓰지 않는다(PHOTO_S3_BUCKET과 같은 이유).
      # 비어 있거나 짧으면 앱이 시작할 때 변수 이름을 알려 주며 실패한다(그래서 빠뜨려도 조용히 넘어가지 않는다)
      PERMIT_HASH_SECRET: ${PERMIT_HASH_SECRET:-}
      # 허가서 글자 판독기: off(기본, 모든 신청이 관리자 대기) | vision(구글 Cloud Vision). 빈 값이면 앱이 시작 실패하므로 :-로 off를 채운다
      PERMIT_OCR_MODE: ${PERMIT_OCR_MODE:-off}
      # vision일 때만 필요한 비밀 값(off면 앱이 읽지 않는다). 파일에 쓰지 않고 서버 .env에서만 읽는다
      VISION_API_KEY: ${VISION_API_KEY:-}
      # 사진 한 장 판독의 전체 시간 상한. 빈 값이면 읽기 실패라 :-로 채운다
      VISION_TIMEOUT: ${VISION_TIMEOUT:-10s}
      # 구글 Vision 하루 전체 호출 상한(S21-d, 모든 회원 합계, 서울 날짜 기준). 앱 기본도 30이다.
      # 빈 값이면 숫자 읽기에 실패하므로 :-로 30을 채운다. 0이면 상한 끔, 음수면 앱이 시작 실패.
      # 월 무료 1,000건 안에 들도록 30 x 31 = 930. 넘으면 구글을 안 부르고 관리자 대기로 남긴다
      VISION_GLOBAL_PER_DAY: ${VISION_GLOBAL_PER_DAY:-30}
    depends_on:
      postgres:
        # DB가 healthy가 된 뒤에 앱 시작
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    # prod 프로필을 줄 때만 실행됨
    profiles: ["prod"]
    # 화면 파일 + nginx(리버스 프록시) 이미지. Docker Hub에서 받아 사용
    image: seokam36/demo-web:latest
    container_name: board-web
    restart: unless-stopped
    mem_limit: 64m
    ports:
      # 브라우저 443(https) -> nginx 443 (실제 사이트. /api 요청은 nginx가 app으로 전달)
      - "443:443"
      # 80은 유지: 인증서 확인(Let's Encrypt)·Deploy 헬스체크·https로 이동(301)용
      - "80:80"
    volumes:
      # 인증서 폴더: 서버의 ~/board/certbot/ 아래(compose 파일 기준 상대 경로). 읽기 전용(:ro)이라 nginx는 읽기만 한다
      # 이름 있는 볼륨 대신 호스트 폴더(bind mount)를 쓴 이유: 서버 cron에서 certbot을 돌리고 파일을 바로 확인하기 쉽다
      - ./certbot/conf:/etc/letsencrypt:ro
      # 인증서 확인용 파일(.well-known)을 certbot이 쓰고 nginx가 읽어서 내주는 폴더
      - ./certbot/www:/var/www/certbot:ro
    # IP 변경은 board-locations.conf의 resolver가 처리, 여기서는 시작 순서만
    depends_on:
      - app

  certbot:
    # 상시 실행 아님: certbot 프로필을 줄 때만 쓰고, prod로 up 할 때는 뜨지 않는다 (`docker compose run --rm certbot ...` 로 필요할 때만 실행)
    profiles: ["certbot"]
    # Let's Encrypt 인증서 발급·갱신 도구. latest 대신 정확한 버전 고정(갑자기 바뀌지 않게)
    image: certbot/certbot:v5.10.0
    container_name: board-certbot
    # 서버 메모리 1GB 대비 상한 (잠깐 돌고 끝나는 일)
    mem_limit: 128m
    volumes:
      # web과 같은 두 폴더를 읽기·쓰기로 (발급한 인증서를 여기에 저장)
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # entrypoint는 이미지 기본(certbot)이라 뒤에 certonly / renew 를 붙여 쓴다
    # 첫 발급(80이 비어 있을 때): docker compose run --rm -p 80:80 certbot certonly --standalone -d board.<도메인> --cert-name board --email <메일> --agree-tos --no-eff-email  (먼저 --dry-run 으로 연습)
    # 이후 발급(web이 떠 있을 때): docker compose run --rm certbot certonly --webroot -w /var/www/certbot -d board.<도메인> --cert-name board --email <메일> --agree-tos --no-eff-email
    # 갱신: docker compose run --rm certbot renew --webroot -w /var/www/certbot  그다음  docker exec board-web nginx -s reload

volumes:
  postgres-data:
