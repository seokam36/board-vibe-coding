plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// JPA로 DB를 다루기 위한 스타터 (Hibernate + 커넥션 풀 포함)
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// 요청 DTO의 @Valid 검증(@NotBlank, @Size 등)을 위한 스타터
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// 인증/인가(비밀번호 해시, CSRF 방어, 접근 규칙)를 위한 Spring Security
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// JWT(액세스 토큰) 발급·검증과 쿠키 토큰 인증 필터를 위한 스타터 (내부적으로 Nimbus JOSE 사용)
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	// 리프레시 토큰을 저장할 Redis 연결 (기본 클라이언트 Lettuce 포함)
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	// 학교 인증 코드 메일을 SMTP로 보내기 위한 JavaMailSender (S10-e, 버전은 Boot BOM 관리)
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	// DB 표 변경을 번호 붙은 SQL(V1, V2...)로 관리하는 Flyway (Boot 4는 flyway-core만으로는 자동 설정이 안 돼 이 스타터가 필요)
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	// Flyway 10+에서 PostgreSQL 지원이 별도 모듈로 분리됨 (실행 시에만 필요, 버전은 Boot BOM 관리)
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	// PostgreSQL JDBC 드라이버 (실행 시에만 필요)
	runtimeOnly 'org.postgresql:postgresql'
	// 보일러플레이트(getter, 생성자) 자동 생성. 컴파일 시에만 필요하고 버전은 Boot BOM이 관리
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	// 테스트에서 csrf() 같은 보안 헬퍼를 쓰기 위한 Spring Security 테스트 지원
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	// 테스트에서 실제 PostgreSQL 컨테이너를 띄우고 @ServiceConnection으로 자동 연결
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
