# 테스트 전용 설정: 비밀키를 저장소에 두지 않고, 실행할 때마다 랜덤으로 만든다.
# ${random.value}는 16진수 32자이고, 두 개를 이어 붙인 64자를 Base64로 디코딩하면 48바이트라 32바이트 조건을 만족한다.
app.jwt.secret=${random.value}${random.value}

# 테스트가 실제 ./uploads 폴더를 더럽히지 않게 사진 저장 폴더를 임시 폴더로 (S13-g2). 모든 테스트가 같은 컨텍스트를 쓰도록 설정 파일에 둔다
app.photo.local-dir=${java.io.tmpdir}/board-vibe-test-uploads

# 테스트 중에는 @Scheduled(사진 청소부)가 저절로 돌지 않게 끈다 (S13-g4). 테스트가 PhotoCleanupJob.runOnce()를 직접 부른다.
# 설정 파일에 두는 이유: 컨텍스트 설정이 테스트마다 달라지면 스프링 컨텍스트를 새로 만들어야 해서다.
app.scheduling.enabled=false
