# 테스트 전용 설정: 비밀키를 저장소에 두지 않고, 실행할 때마다 랜덤으로 만든다.
# ${random.value}는 16진수 32자이고, 두 개를 이어 붙인 64자를 Base64로 디코딩하면 48바이트라 32바이트 조건을 만족한다.
app.jwt.secret=${random.value}${random.value}

# 허가서 번호 해시용 비밀 값(S20-b)도 같은 방식으로 실행할 때마다 랜덤 64자(32바이트 이상 조건 만족). 저장소에 실제 값을 두지 않는다.
app.permit.hash-secret=${random.value}${random.value}

# 테스트가 실제 ./uploads 폴더를 더럽히지 않게 사진 저장 폴더를 임시 폴더로 (S13-g2). 모든 테스트가 같은 컨텍스트를 쓰도록 설정 파일에 둔다
app.photo.local-dir=${java.io.tmpdir}/board-vibe-test-uploads

# 테스트 중에는 @Scheduled(사진 청소부)가 저절로 돌지 않게 끈다 (S13-g4). 테스트가 PhotoCleanupJob.runOnce()를 직접 부른다.
# 설정 파일에 두는 이유: 컨텍스트 설정이 테스트마다 달라지면 스프링 컨텍스트를 새로 만들어야 해서다.
app.scheduling.enabled=false

# 컬렉션 fetch join에 페이징(limit)을 걸면 메모리에서 자르는 실수를 조용히 넘기지 않고 예외로 드러낸다 (S14-g)
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true

# 테스트는 AI를 끈 상태로 고정한다 (CI에는 Ollama가 없고, 환경변수 LLM_MODE에 따라 결과가 달라지면 안 된다) (S17-b)
app.llm.mode=off

# 허가서 글자 판독기도 테스트는 꺼짐으로 고정한다(S20-e2): 환경변수 PERMIT_OCR_MODE·VISION_API_KEY에 따라 결과가 달라지면 안 되고, 테스트가 진짜 구글을 부르면 안 된다.
# vision 모드를 직접 보는 테스트만 @SpringBootTest(properties=...)로 덮어쓴다.
app.permit.ocr.mode=off
app.permit.ocr.vision.api-key=

# 챗봇 횟수 제한은 테스트 기본값을 아주 크게 둔다: 한 테스트에서 같은 회원이 여러 번 묻는 기존 테스트가 429로 깨지지 않게 (S17-f1)
# 횟수 제한을 직접 보는 ChatRateLimitTests만 @SpringBootTest(properties=...)로 5/30으로 덮어쓴다
app.chat.rate-limit.per-minute=100000
app.chat.rate-limit.per-day=1000000
# 서버 전체 질문 상한(S18-d)은 테스트 기본 0(검사 안 함). 직접 보는 ChatGlobalLimitTests만 @SpringBootTest(properties=...)로 덮어쓴다
app.chat.global-limit.per-minute=0
app.chat.global-limit.per-day=0

# 푸시 발송기도 테스트는 꺼짐으로 고정한다(S24-b): 환경변수 PUSH_MODE에 따라 결과가 달라지면 안 되고, 테스트가 진짜 구글을 부르면 안 된다.
app.push.mode=off

# 중고 사진 검사기도 테스트는 꺼짐으로 고정한다(S30-a): 환경변수 MARKET_SAFESEARCH_MODE·VISION_API_KEY에 따라 결과가 달라지면 안 되고, 테스트가 진짜 구글을 부르면 안 된다.
# vision 모드를 직접 보는 테스트만 @SpringBootTest(properties=...)로 덮어쓴다.
app.market.safesearch.mode=off
app.market.safesearch.api-key=
