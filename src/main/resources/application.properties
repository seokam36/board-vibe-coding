spring.application.name=demo
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=false

# DB 접속 정보는 환경변수로 받는다 (비밀 값을 코드에 쓰지 않기 위함)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate는 표를 바꾸지 않고 엔티티와 DB 구조가 맞는지 검사만 한다 (표 변경은 Flyway SQL로만)
spring.jpa.hibernate.ddl-auto=validate

# Flyway: 빈 DB는 V1부터 실행한다. 표는 있는데 기록장(flyway_schema_history)이 없는 DB는 일부러 거절한다
# (baseline-on-migrate를 켜면 이상한 DB도 "V1 적용됨"으로 잘못 인정하기 때문. S6-c에서 운영·로컬 모두 기록장이 생겨 껐다)
# spring.flyway.baseline-on-migrate 는 S6-c 후속에서 삭제(기록장 없는 DB는 거절). 옛 백업 복구 때만 deploy.md의 일회성 절차로 켠다

# 컨트롤러/뷰 단계까지 DB 연결을 붙잡지 않도록 끈다 (작은 서버, 커넥션 풀 3개에 맞춤)
spring.jpa.open-in-view=false

# 브라우저에서 API를 호출할 수 있는 프론트엔드 주소 (쉼표로 여러 개, 기본값은 로컬 Vite 개발 서버)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT 서명 비밀키: Base64 문자열(디코딩 후 32바이트 이상). 환경변수로만 받는다 (기본값은 빈 값이라 미설정이면 시작 때 안내 메시지와 함께 실패)
app.jwt.secret=${JWT_SECRET:}
# 액세스 토큰 수명 (access_token 쿠키의 Max-Age도 이 값을 따른다)
app.jwt.access-token-expiry=15m
# access_token·refresh_token 쿠키의 Secure 속성: HTTPS 환경에서만 true. 로컬(http)과 현재 EC2(http)는 false
app.cookie.secure=${COOKIE_SECURE:false}
# 리프레시 토큰 수명 (Redis TTL과 refresh_token 쿠키 Max-Age가 이 값을 따른다)
app.jwt.refresh-token-expiry=7d
# refresh_token 쿠키 경로: 브라우저 기준. nginx/Vite가 /api를 떼고 백엔드엔 /auth로 넘기므로 /api/auth
app.cookie.refresh-path=/api/auth

# Redis 접속 정보 (리프레시 토큰 저장). 비밀번호는 환경변수로만 받는다
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
# 응답·연결 대기를 2초로 제한: Lettuce 기본이 60초라 Redis가 죽으면 요청이 오래 멈춘다
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

# (Jackson 3에서는 이 옵션이 deserialization이 아니라 datatype.enum 쪽으로 옮겨졌다)
# enum 자리에 숫자(예: {"reason":0})를 보내면 "몇 번째 값"으로 몰래 받아주지 않고 400으로 거절한다
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true

# 학교 메일 인증 (S10). 메일 발송 방식: log = 실제 발송 없이 로그에만 찍는 가짜 발송(기본), smtp = 실제 SMTP 발송(S10-e)
app.mail.mode=${MAIL_MODE:log}
# 코드 유효 시간 / 재발송 최소 간격 / 회원당 하루 발송 상한 / 확인 실패 허용 횟수(S10-c)
app.verification.code-ttl=10m
app.verification.resend-interval=60s
app.verification.daily-limit=10
app.verification.max-attempts=5

# smtp 모드 설정 (S10-e). 값은 전부 환경변수로만 받는다. host가 비어도 Boot가 빈 JavaMailSender를 만들긴 하지만 log 모드에선 쓰지 않는다(메일 헬스체크도 꺼 둠)
app.mail.from=${MAIL_FROM:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
# 587 포트는 STARTTLS(평문으로 시작해 암호화로 전환)를 필수로 요구하고 로그인(auth)을 한다
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# 연결·읽기·쓰기 타임아웃(ms): 재발송 쿨다운(60초)보다 훨씬 짧게 잡아 SMTP가 느려도 요청이 오래 멈추지 않게 한다
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# 헬스체크가 SMTP 연결까지 확인하면 메일 서버 장애 때 앱 전체가 503이 되므로 끈다
management.health.mail.enabled=false
