spring.application.name=demo
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=false
# 노출한 actuator는 health뿐이다. 혹시 env·configprops를 나중에 열더라도 설정 값(GEMINI_API_KEY 등)이 화면에 나오지 않게 값 표시를 끈다(S18-c)
management.endpoint.env.show-values=never
management.endpoint.configprops.show-values=never

# DB 접속 정보는 환경변수로 받는다 (비밀 값을 코드에 쓰지 않기 위함)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# PostgreSQL 드라이버가 서버 오류의 Detail(예: Key (permit_number_hash)=(...) already exists)을 예외 메시지·로그에 넣지 않게 한다 (S20-b).
# 허가서 번호 해시 같은 값이 로그에 남는 것을 막는다. 제약 이름(constraint "uk_...")은 메시지에 그대로 남아 ConstraintViolations가 계속 읽는다.
# URL이 아니라 이 속성으로 넣는 이유: 운영 compose의 DB_URL을 안 바꿔도 되고, 테스트(Testcontainers가 URL을 정함)에도 똑같이 적용된다.
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false

# Hibernate는 표를 바꾸지 않고 엔티티와 DB 구조가 맞는지 검사만 한다 (표 변경은 Flyway SQL로만)
spring.jpa.hibernate.ddl-auto=validate

# Flyway: 빈 DB는 V1부터 실행한다. 표는 있는데 기록장(flyway_schema_history)이 없는 DB는 일부러 거절한다
# (baseline-on-migrate를 켜면 이상한 DB도 "V1 적용됨"으로 잘못 인정하기 때문. S6-c에서 운영·로컬 모두 기록장이 생겨 껐다)
# spring.flyway.baseline-on-migrate 는 S6-c 후속에서 삭제(기록장 없는 DB는 거절). 옛 백업 복구 때만 deploy.md의 일회성 절차로 켠다

# 컨트롤러/뷰 단계까지 DB 연결을 붙잡지 않도록 끈다 (작은 서버, 커넥션 풀 3개에 맞춤)
spring.jpa.open-in-view=false

# 브라우저에서 API를 호출할 수 있는 프론트엔드 주소 (쉼표로 여러 개, 기본값은 로컬 Vite 개발 서버)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT 서명 비밀키: Base64 문자열(디코딩 후 32바이트 이상). 환경변수로만 받는다 (기본값은 빈 값이라 미설정이면 시작 때 안내 메시지와 함께 실패)
app.jwt.secret=${JWT_SECRET:}
# 액세스 토큰 수명 (access_token 쿠키의 Max-Age도 이 값을 따른다)
app.jwt.access-token-expiry=15m
# access_token·refresh_token 쿠키의 Secure 속성: HTTPS 환경에서만 true. 로컬(http)과 현재 EC2(http)는 false
app.cookie.secure=${COOKIE_SECURE:false}
# 리프레시 토큰 수명 (Redis TTL과 refresh_token 쿠키 Max-Age가 이 값을 따른다)
app.jwt.refresh-token-expiry=7d
# refresh_token 쿠키 경로: 브라우저 기준. nginx/Vite가 /api를 떼고 백엔드엔 /auth로 넘기므로 /api/auth
app.cookie.refresh-path=/api/auth

# Redis 접속 정보 (리프레시 토큰 저장). 비밀번호는 환경변수로만 받는다
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
# 응답·연결 대기를 2초로 제한: Lettuce 기본이 60초라 Redis가 죽으면 요청이 오래 멈춘다
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

# (Jackson 3에서는 이 옵션이 deserialization이 아니라 datatype.enum 쪽으로 옮겨졌다)
# enum 자리에 숫자(예: {"reason":0})를 보내면 "몇 번째 값"으로 몰래 받아주지 않고 400으로 거절한다
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true

# 허가서 번호 해시(HMAC-SHA256)에 섞는 비밀 값 (S20-b). 환경변수로만 받는다. 기본은 빈 값이라 미설정이면(32바이트 미만도) 시작 때 실패한다.
app.permit.hash-secret=${PERMIT_HASH_SECRET:}

# 허가서 기한 만료 정리 (S20-c). 대기가 pending-ttl(ISO, P14D = 14일)을 넘기면 자동 반려(EXPIRED)하고 사진을 지운다.
# expiry-initial-delay: 서버가 켜진 뒤 첫 실행까지 / expiry-interval: 한 번 끝나고 다음 실행까지(운영 서버를 평소 꺼 두므로 켜진 뒤 바로 도는 방식)
# expiry-batch-size: 한 번에 읽는 묶음 크기(한 실행에서 묶음씩 반복). pending-ttl·batch-size가 0 이하면 기동 실패
# pending-ttl(14일)은 원본 한 곳. 코드에 기본값을 두지 않는다(없으면 기동 실패).
# 바꾸면 같이 바꿀 곳: flutter_app/lib/permit/permit_texts.dart(동의 문구), flutter_app/lib/permit/permit_reject_reasons.dart(만료 사유 문구),
#                    S3 수명 규칙 permits-expire-14d, docs/api.md,
#                    flutter_app/test의 14일 문구 테스트, docs/deploy.md
app.permit.pending-ttl=P14D
app.permit.expiry-initial-delay=PT3M
app.permit.expiry-interval=PT1H
app.permit.expiry-batch-size=100

# 허가서 사진 글자 판독기 (S20-e2). off(기본) = 항상 못 읽음(모든 신청이 관리자 대기), vision = 구글 Cloud Vision. 그 밖의 값이면 시작 때 실패한다.
# vision 모드는 키(VISION_API_KEY)가 비었거나 공백·줄바꿈이 끼면 시작 때 실패한다. 키는 절대 여기에 쓰지 않는다(환경변수로만).
# Vision 키는 Gemini 키와 다른 프로젝트·결제로 만든다(API 제한은 Cloud Vision API만). 운영은 vision으로 켜져 있다(2026-11-18). 끄려면 PERMIT_OCR_MODE=off.
app.permit.ocr.mode=${PERMIT_OCR_MODE:off}
app.permit.ocr.vision.api-key=${VISION_API_KEY:}
# 사진 한 장 판독의 전체 상한(단위 없는 숫자는 초). 이 시간이 지나면 못 읽음(UNREADABLE)으로 두고 신청 응답은 그대로 간다(POST가 최대 이만큼 늦어짐)
app.permit.ocr.vision.timeout=${VISION_TIMEOUT:10s}
# 전용 환경변수는 일부러 없다(테스트만 가짜 서버 주소로 덮어씀). PermitOcrConfig가 구글 Vision 주소(https)와 내 컴퓨터만 허용한다.
app.permit.ocr.vision.base-url=https://vision.googleapis.com
# 구글을 동시에 부르는 최대 수(넘으면 기다리지 않고 바로 못 읽음), 서버가 다시 만든 사진(base64로 바꾸기 전)이 7MB보다 크면 부르지 않음(요청 JSON 10MB 한도 안에 base64가 들어가게)
app.permit.ocr.vision.max-concurrent=2
app.permit.ocr.vision.max-image-size=7MB
# 서버 전체(모든 회원 합계) 하루 구글 호출 상한(서울 날짜, S21-d). 넘으면 구글을 부르지 않고 관리자 대기. 기본 30, 0이면 상한 끔, 음수면 시작 실패. off 모드에선 세지 않는다.
app.permit.ocr.vision.global-per-day=${VISION_GLOBAL_PER_DAY:30}

# 사진 로컬 저장 폴더 (S13-g1, 개발·테스트용). 바꾸려면 APP_PHOTO_LOCAL_DIR 환경변수나 이 값을 고친다. uploads/는 .gitignore에 있다
app.photo.local-dir=${APP_PHOTO_LOCAL_DIR:./uploads}

# 사진 창고 종류 (S13-g6-3): local = 내 컴퓨터 폴더(기본값, 개발·테스트용) / s3 = AWS S3(운영). 환경변수 PHOTO_STORAGE로 고른다
app.photo.storage=${PHOTO_STORAGE:local}
# s3일 때만 쓴다. 버킷 이름·리전은 환경변수로만 받는다(비면 s3 모드는 시작 때 실패). 액세스 키는 쓰지 않고 EC2의 IAM 역할을 쓴다
app.photo.s3.bucket=${PHOTO_S3_BUCKET:}
app.photo.s3.region=${PHOTO_S3_REGION:}

# 사진 청소부 (S13-g4). 못 지운 사진 파일을 대기 표에서 찾아 마저 지운다. 시간은 ISO 형식(PT10M = 10분)
# cleanup-interval: 한 번 끝나고 다음 실행까지 쉬는 시간 / cleanup-min-age: 표에 적힌 지 이만큼 지난 줄만 처리(지금 막 올리는 사진을 건드리지 않으려고)
app.photo.cleanup-interval=PT10M
app.photo.cleanup-min-age=PT10M

# 사진 업로드 한도 (S13-g2). 파일 하나 10MB, 요청 전체는 멀티파트 포장지 여유를 두고 11MB. 넘으면 413
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# 401·413처럼 본문을 읽지 않고 응답할 때, 남은 본문을 Tomcat이 버려 주는 한도(기본 2MB). 이걸 넘으면 Tomcat이 연결을 끊어
# 브라우저가 응답(401·413)을 못 보고 네트워크 오류만 보게 된다. 요청 한도(11MB)와 같게 둬서 큰 사진도 응답이 정상으로 온다.
server.tomcat.max-swallow-size=11MB

# AI(LLM) 연결 (S17-b). off(기본) = AI 끔, ollama = 내 PC의 Ollama, gemini = 구글 제미나이 API(S18). 그 밖의 값이면 시작 때 실패한다
app.llm.mode=${LLM_MODE:off}
# ollama 모드 설정: 서버 주소, 모델, 질문 하나 전체의 시간 예산(S17-a 실측으로 60초)
# timeout = AI 호출 하나가 아니라 "질문 하나 전체" 예산이다. 양식 호출과 답 호출 2번이 이 시간을 나눠 쓴다(남은 시간만큼만 기다림).
# 이 값을 올리면 flutter_app/nginx.conf의 /api/chat(proxy_read_timeout 75초)와 flutter_app/lib/pages/chat_page.dart(90초)도 같이 올린다.
# 순서는 항상 서버 < nginx < 화면이어야 한다(서버가 먼저 504로 끝내야 화면이 정해진 문구를 보여 줄 수 있다).
app.llm.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
app.llm.ollama.model=${OLLAMA_MODEL:qwen3:8b}
app.llm.ollama.timeout=${OLLAMA_TIMEOUT:60s}

# gemini 모드 설정 (S18-c). 무료 등급(AI Studio 키)을 쓴다: 한도는 분당 15번·하루 500번이고, 보낸 내용은 구글의 제품 개선에 쓰일 수 있다.
# 키는 절대 여기에 쓰지 않는다(환경변수 GEMINI_API_KEY로만 받는다). 기본은 빈 값이라 gemini 모드인데 비면 시작 때 실패한다.
app.llm.gemini.api-key=${GEMINI_API_KEY:}
# 모델은 3.x 계열이어야 한다: 코드가 보내는 thinkingLevel=minimal 설정이 3.x 전용이라 2.5 이하는 400 오류(→ 화면엔 503)가 난다. models/ 접두사는 붙이지 않는다.
app.llm.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
# timeout = 호출 하나가 아니라 "질문 하나 전체" 예산이다(양식 호출 + 답 호출이 나눠 씀. 호출 하나의 상한도 겸함). 단위 없는 숫자는 초.
# 이 값을 올리면 flutter_app/nginx.conf의 /api/chat(75초)와 flutter_app/lib/pages/chat_page.dart(90초)도 같이 올린다(서버 < nginx < 화면).
app.llm.gemini.timeout=${GEMINI_TIMEOUT:30s}
# 전용 환경변수(GEMINI_BASE_URL)는 일부러 만들지 않았다. 스프링 규칙상 app.llm.gemini.base-url 속성이나 APP_LLM_GEMINI_BASEURL·APP_LLM_GEMINI_BASE_URL
# 환경변수로는 바꿀 수 있어서, LlmConfig가 https(내 컴퓨터만 http)만 허용한다. 기본값은 구글 공식 주소이고 테스트만 가짜 서버 주소로 덮어쓴다.
# app.llm.gemini.base-url=https://generativelanguage.googleapis.com

# 챗봇 회원별 질문 횟수 제한 (S17-f1): 1분에 5번, 서울 하루에 30번. 넘으면 429
# 값을 바꾸면 flutter_app/lib/errors/error_messages.dart의 chatRateLimited 문구와 docs/api.md 43번도 같이 바꾼다
app.chat.rate-limit.per-minute=5
app.chat.rate-limit.per-day=30

# 챗봇 서버 전체 질문 상한 (S18-d): 모든 회원 합계. 넘으면 503(화면 문구는 "AI를 지금 사용할 수 없어요"). 0이면 그 칸은 검사하지 않는다(기본, 로컬 개발용).
# 단위는 "질문"이다(질문 하나 = AI 호출 최대 2번). 운영 권장(구글 무료 등급 분당 15·하루 500 호출 기준): 분 7 = 15÷2, 하루 200 = 500×0.8÷2(여유 20%).
# 하루는 구글 한도가 리셋되는 태평양 시간 자정(한국 오후 4~5시) 기준이다. 운영 값은 compose의 환경변수로 넣는다. 음수면 시작 실패.
app.chat.global-limit.per-minute=${CHAT_GLOBAL_PER_MINUTE:0}
app.chat.global-limit.per-day=${CHAT_GLOBAL_PER_DAY:0}

# 챗봇 동시 질문 상한 (S17-f2): 서버 전체에서 동시에 2개까지, 자리가 없으면 5초 기다렸다가 503
app.chat.max-concurrent=2
app.chat.slot-wait=5s

# 푸시 알림 발송기 (S24-b). off(기본) = 아무것도 안 보냄, fcm = 구글 FCM(Firebase Cloud Messaging). 그 밖의 값이면 시작 때 실패한다.
# fcm 모드는 서비스 계정 키 파일 경로(FCM_CREDENTIALS_FILE)가 비었거나, 없는 파일이거나, 서비스 계정 키(JSON)가 아니면 시작 때 실패한다. 키 파일은 절대 저장소에 두지 않는다(서버 파일 + compose 읽기 전용 마운트).
# 프로젝트 ID는 키 파일 안의 project_id에서 읽는다(따로 환경변수 없음).
app.push.mode=${PUSH_MODE:off}
app.push.fcm.credentials-file=${FCM_CREDENTIALS_FILE:}
# 전용 환경변수는 일부러 없다(테스트만 가짜 서버 주소로 덮어씀). PushConfig가 구글 FCM 주소(https)와 내 컴퓨터만 허용한다.
app.push.fcm.base-url=https://fcm.googleapis.com
# 알림 한 건 발송의 시간 상한(단위 없는 숫자는 초)
app.push.fcm.timeout=${FCM_TIMEOUT:10s}
