spring.application.name=demo
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=false

# DB 접속 정보는 환경변수로 받는다 (비밀 값을 코드에 쓰지 않기 위함)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 엔티티 기준으로 테이블을 자동 생성/갱신 (PostgreSQL은 기본으로 스키마를 만들지 않음)
spring.jpa.hibernate.ddl-auto=update

# 컨트롤러/뷰 단계까지 DB 연결을 붙잡지 않도록 끈다 (작은 서버, 커넥션 풀 3개에 맞춤)
spring.jpa.open-in-view=false

# 브라우저에서 API를 호출할 수 있는 프론트엔드 주소 (쉼표로 여러 개, 기본값은 로컬 Vite 개발 서버)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT 서명 비밀키: Base64 문자열(디코딩 후 32바이트 이상). 환경변수로만 받는다 (기본값은 빈 값이라 미설정이면 시작 때 안내 메시지와 함께 실패)
app.jwt.secret=${JWT_SECRET:}
# 액세스 토큰 수명 (access_token 쿠키의 Max-Age도 이 값을 따른다)
app.jwt.access-token-expiry=15m
# access_token 쿠키의 Secure 속성: HTTPS 환경에서만 true. 로컬(http)과 현재 EC2(http)는 false
app.cookie.secure=${COOKIE_SECURE:false}
