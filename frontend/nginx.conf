server {
    listen 80;

    # 도커 내부 주소록(DNS). 10초마다 app 주소를 다시 확인한다
    resolver 127.0.0.11 valid=10s ipv6=off;
    # 주소를 변수에 담으면 nginx가 시작할 때 IP를 고정하지 않고 요청 때마다 resolver로 찾는다
    # (app 컨테이너가 다시 만들어져 IP가 바뀌어도 따라간다. app이 아직 없어도 nginx는 시작되고, 요청 때만 502가 난다)
    set $backend http://app:8080;

    root /usr/share/nginx/html;
    index index.html;

    # 프록시 공통 헤더: 백엔드가 실제 접속자 정보를 알 수 있게 전달한다
    # (location 안에 add_header/proxy_set_header를 하나라도 쓰면 상위 설정이 상속되지 않으므로,
    #  프록시 location마다 같은 헤더를 직접 적는다)

    # API: /api/posts -> app:8080/posts
    # 변수를 쓰면 proxy_pass 끝의 "/" 로 접두사를 뗄 수 없어서 rewrite로 /api 를 뗀다
    # (rewrite는 쿼리스트링을 자동으로 유지한다. break: 다시 location 검색 없이 바로 프록시)
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /api/ 프록시를 통해 actuator로 우회하는 것을 막는다 (끝 슬래시 없이 써서 /api/actuator 도 막는다)
    # (nginx 차단은 보조. 실제 차단은 백엔드 application.properties의 exposure 설정(health만))
    location ^~ /api/actuator {
        return 404;
    }

    # 헬스체크: 정확히 이 경로만 연다 (=). 경로를 그대로 전달한다.
    # actuator의 다른 경로(env 등)는 nginx에서 열지 않는다
    location = /actuator/health {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 화면 파일. 없는 경로(/posts/1 새로고침 등)는 index.html로 보내 React가 라우팅하게 한다
    location / {
        try_files $uri $uri/ /index.html;
        # index.html은 항상 최신본을 확인하게 한다 (새 배포가 바로 반영되도록)
        add_header Cache-Control "no-cache";
    }

    # Vite가 파일명에 해시를 붙이므로 내용이 바뀌면 이름도 바뀐다 -> 오래 캐시해도 안전
    # (이 location은 위 location /의 add_header를 상속하지 않으므로 여기서 따로 지정)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
